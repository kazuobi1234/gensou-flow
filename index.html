<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="light">
<title>幻想 制作管理</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d0a12">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GensouFlow">
<style>
  :root{
    --bg:#0d0a12;
    --surface:#17121f;
    --surface2:#241a30;
    --gold:#e8c65c;
    --gold-soft:rgba(232,198,92,0.45);
    --purple:#8b5cf6;
    --purple-soft:rgba(139,92,246,0.35);
    --text:#f4e9d0;
    --text-dim:#b8aecb;
    --danger:#e08a9e;
    --danger-bg:#2a1420;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  header{padding:32px 20px 16px;}
  .eyebrow{font-size:11px;letter-spacing:0.3em;color:var(--purple);margin:0 0 4px;}
  h1{font-size:22px;font-weight:700;margin:0;font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;}
  main{padding:0 20px 120px;}

  /* --- 一覧 --- */
  .empty{
    margin-top:24px;padding:32px;text-align:center;color:#8b7fa3;
    border:1px dashed var(--gold-soft);border-radius:16px;font-size:14px;line-height:1.7;
  }
  .work-card{
    width:100%;text-align:left;display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid rgba(232,198,92,0.3);
    border-radius:16px;padding:14px;margin-bottom:12px;
    color:inherit;font:inherit;cursor:pointer;
  }
  .work-card:active{transform:scale(0.98);}
  .moon{
    position:relative;flex-shrink:0;border-radius:50%;
    background:var(--surface2);box-shadow:inset 0 0 0 1px var(--gold-soft);
    overflow:hidden;
  }
  .work-body{flex:1;min-width:0;}
  .work-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar{width:100%;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px;}
  .bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--gold));transition:width 400ms ease;}
  .work-count{font-size:14px;font-weight:600;white-space:nowrap;color:var(--text-dim);}
  .work-count.done{color:var(--gold);}

  .fab{
    position:fixed;right:20px;bottom:24px;display:flex;align-items:center;gap:8px;
    background:var(--gold);color:#1a1220;border:none;border-radius:999px;
    padding:16px 22px;font-size:15px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .fab:active{transform:scale(0.95);}

  /* --- 詳細 --- */
  .topbar{display:flex;align-items:center;gap:10px;padding:24px 16px 16px;}
  .back-btn{background:none;border:none;color:var(--gold);font-size:26px;padding:6px;line-height:1;}
  .detail-title{font-size:20px;font-weight:700;font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .progress-box{
    display:flex;align-items:center;gap:16px;background:var(--surface);
    border:1px solid rgba(232,198,92,0.3);border-radius:16px;padding:18px;margin:0 20px 20px;
  }
  .progress-count{font-size:17px;font-weight:700;margin-bottom:6px;}

  .next-banner{
    margin:0 20px 20px;padding:12px 16px;border-radius:16px;text-align:center;font-weight:700;
    background:rgba(139,92,246,0.15);color:#c9b8f0;border:1px solid var(--purple-soft);
  }
  .next-banner.done{background:rgba(232,198,92,0.16);color:var(--gold);border-color:var(--gold-soft);}

  .step{
    width:calc(100% - 40px);margin:0 20px 8px;display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--purple-soft);border-radius:12px;
    padding:16px;text-align:left;font-size:16px;color:var(--text);
  }
.step.checked{
  background:rgba(232,198,92,0.16);
  border-color:var(--gold-soft);
}
  .checkbox{
    width:30px;height:30px;flex-shrink:0;border-radius:8px;border:2px solid var(--purple);
    display:flex;align-items:center;justify-content:center;font-size:16px;color:#1a1220;
  }
  .step.checked .checkbox{background:var(--gold);border-color:var(--gold);}
  .step.checked .label{text-decoration:line-through;opacity:0.75;}
  .step-main{flex:1;min-width:0;}
  .owner{display:inline-block;margin-top:5px;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.04em;}
  .company-label{margin:0 20px 12px;color:var(--text-dim);font-size:12px;}
  .company-label strong{color:var(--gold);}
  .ai-panel{margin:0 20px 16px;padding:16px;background:var(--surface);border:1px solid var(--gold-soft);border-radius:16px;}
  .ai-panel h3{margin:0 0 6px;font-size:16px;color:var(--gold);}
  .ai-panel p{margin:0 0 12px;color:var(--text-dim);font-size:13px;line-height:1.6;}
  .ai-panel textarea{width:100%;min-height:90px;resize:vertical;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--purple-soft);color:var(--text);font:inherit;font-size:16px;outline:none;}
  .ai-status{display:inline-block;margin:10px 0;padding:5px 9px;border-radius:999px;background:var(--surface2);color:#c9b8f0;font-size:12px;font-weight:700;}
  .ai-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .ai-actions button{flex:1;min-width:120px;padding:12px;border:0;border-radius:10px;font-weight:700;font-size:14px;}
  .ai-save{background:var(--purple);color:white;}
  .ai-run{background:#3f2b66;color:white;}
  .ai-actions button:disabled{opacity:.55;cursor:wait;}
  .ai-complete{background:var(--gold);color:#1a1220;}

  .action-row{display:flex;gap:12px;margin:20px;}
  .action-btn{
    flex:1;padding:14px;border-radius:12px;border:none;font-size:14px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .action-btn.reset{background:var(--surface2);color:#c9b8f0;}
  .action-btn.delete{background:var(--danger-bg);color:var(--danger);}

  /* --- モーダル --- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(2px);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px;
  }
  .modal{
    width:100%;max-width:380px;background:var(--surface);border:1px solid var(--gold-soft);
    border-radius:20px;padding:20px;margin-bottom:16px;
  }
  .modal h3{margin:0 0 8px;font-size:17px;}
  .modal p{margin:0 0 18px;font-size:14px;color:var(--text-dim);line-height:1.6;}
  .modal input{
    width:100%;padding:14px;border-radius:12px;background:var(--bg);
    border:1px solid var(--gold-soft);color:var(--text);font-size:16px;margin-bottom:16px;outline:none;
  }
  .modal-row{display:flex;gap:12px;}
  .btn{flex:1;padding:14px;border-radius:12px;border:none;font-size:14px;font-weight:600;}
  .btn.cancel{background:var(--surface2);color:#e6dcf5;}
  .btn.confirm{background:var(--purple);color:#fdf6e3;}
  .btn.confirm.gold{background:var(--gold);color:#1a1220;}
  .btn.confirm.danger{background:#7a2338;color:#fdf6e3;}
  .btn:disabled{opacity:0.4;}

  .toast{
    position:fixed;top:0;left:0;right:0;z-index:60;background:#7a2338;color:#fdf6e3;
    text-align:center;font-size:12px;padding:10px 12px;display:flex;justify-content:center;gap:12px;
  }
  .toast button{background:none;border:none;color:#fdf6e3;text-decoration:underline;font-weight:700;font-size:12px;}

/* 完了カードの色を強制指定 */
.step.checked {
  background: #5a461f !important;
  border-color: #e8c65c !important;
}

.step.checked .checkbox {
  background: #e8c65c !important;
  border-color: #e8c65c !important;
  color: #1a1220 !important;
}

.step.checked .label {
  color: #fff4cf !important;
  opacity: 1 !important;
}
html {
  color-scheme: only light !important;
}

body {
  color-scheme: only light !important;
}
</style>
</head>
<body>
<div id="toast-area"></div>
<div id="app"></div>

<script>
const STEPS = [
  { label:"企画", owner:"チャッピー＋九軒" },
  { label:"調査", owner:"シラベ" },
  { label:"制作", owner:"サク" },
  { label:"販売データ作成", owner:"ギョウ" },
  { label:"商品画像", owner:"サク" },
  { label:"タイトル", owner:"カク" },
  { label:"タグ", owner:"カク" },
  { label:"説明文", owner:"カク" },
  { label:"価格", owner:"ギョウ" },
  { label:"最終確認", owner:"九軒（社長）" },
  { label:"出品", owner:"ギョウ" },
  { label:"Instagram宣伝", owner:"ヨウ" },
  { label:"結果分析", owner:"マトメ" }
];
const STORAGE_KEY = "gensou-flow-works-v1";

// ---- ローカル保存（このブラウザ/端末だけに残る） ----
function loadWorks(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    console.error("読み込みエラー", e);
    return [];
  }
}
function saveWorks(works){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(works));
    return true;
  }catch(e){
    console.error("保存エラー", e);
    return false;
  }
}

let state = {
  works: loadWorks(),
  openId: null,
  showNew: false,
  confirm: null // {type:'delete'|'reset', workId}
};

function persist(){
  const ok = saveWorks(state.works);
  saveWorksToCloud(state.works);
  const toastArea = document.getElementById("toast-area");
  toastArea.innerHTML = ok ? "" : `
    <div class="toast">
      <span>保存に失敗しました（この端末の空き容量をご確認ください）</span>
      <button onclick="persist()">再試行する</button>
    </div>`;
}

function normalizeWorks(){
  state.works.forEach(w=>{
    if(!Array.isArray(w.steps)) w.steps = [];
    while(w.steps.length < STEPS.length) w.steps.push(false);
    if(w.steps.length > STEPS.length) w.steps = w.steps.slice(0, STEPS.length);
    if(!w.ai) w.ai = {};
    if(!w.ai.shirabe) w.ai.shirabe = { request:"", result:"", status:"未依頼" };
    ["saku","kaku","gyou","you","matome","chappy"].forEach(key=>{
      if(!w.ai[key]) w.ai[key] = { request:"", result:"", status:"未依頼" };
    });
  });
}
function render(){
  normalizeWorks();
  const app = document.getElementById("app");
  app.innerHTML = state.openId ? renderDetail() : renderList();
  if(state.showNew) app.innerHTML += renderNewModal();
  if(state.confirm) app.innerHTML += renderConfirmModal();
}

function moonHtml(ratio, size){
  const pct = Math.round(ratio * 100);
  return `<div class="moon" style="
    width:${size}px;
    height:${size}px;
    background:linear-gradient(
      to right,
      #fff2a8 0%,
      #ffd95a ${pct}%,
      #241a30 ${pct}%,
      #241a30 100%
    );
  "></div>`;
}

function renderList(){
  const items = state.works.map(w=>{
    const done = w.steps.filter(Boolean).length;
    const ratio = done/STEPS.length;
    return `
      <button class="work-card" onclick="openWork('${w.id}')">
        ${moonHtml(ratio,44)}
        <div class="work-body">
          <div class="work-name">${escapeHtml(w.name)}</div>
          <div class="bar"><div class="bar-fill" style="width:${Math.round(ratio*100)}%"></div></div>
        </div>
        <div class="work-count ${done===STEPS.length?'done':''}">${done} / ${STEPS.length}</div>
      </button>`;
  }).join("");

  return `
    <header>
      <p class="eyebrow">GENSOU FLOW</p>
      <h1>幻想 AIカンパニー</h1>
    </header>
    <main>
      ${state.works.length===0 ? `<div class="empty">まだ作品がありません。<br>右下の「＋」から最初の作品を登録しましょう。</div>` : items}
    </main>
    <button class="fab" onclick="state.showNew=true; render();">＋ 新しい作品</button>
  `;
}

function renderDetail(){
  const w = state.works.find(x=>x.id===state.openId);
  if(!w){ state.openId=null; return renderList(); }
  const done = w.steps.filter(Boolean).length;
  const ratio = done/STEPS.length;
  const nextIndex = w.steps.findIndex(s=>!s);
  const allDone = nextIndex===-1;

  const stepsHtml = STEPS.map((label,i)=>{
    const checked = !!w.steps[i];
    return `
      <button class="step ${checked?'checked':''}" onclick="toggleStep('${w.id}',${i})">
        <span class="checkbox">${checked?'✓':''}</span>
        <span class="step-main">
          <span class="label">${i+1}. ${escapeHtml(label.label)}</span><br>
          <span class="owner">担当：${escapeHtml(label.owner)}</span>
        </span>
      </button>`;
  }).join("");

  return `
    <div class="topbar">
      <button class="back-btn" onclick="state.openId=null; render();">‹</button>
      <div class="detail-title">${escapeHtml(w.name)}</div>
    </div>
    <div class="progress-box">
      ${moonHtml(ratio,56)}
      <div style="flex:1">
        <div class="progress-count">${done} / ${STEPS.length} 完了</div>
        <div class="bar"><div class="bar-fill" style="width:${Math.round(ratio*100)}%"></div></div>
      </div>
    </div>
    <div class="next-banner ${allDone?'done':''}">
      ${allDone ? "🎉 全工程完了！" : `次は『${escapeHtml(STEPS[nextIndex].label)}』｜担当：${escapeHtml(STEPS[nextIndex].owner)}`}
    </div>
    <div class="company-label"><strong>AIカンパニー工程</strong> — 社員ごとの担当をつないで進行</div>
    ${renderShirabePanel(w)}
    ${renderEmployeePanel(w,"saku","🎨 サク","制作・商品画像","シラベの結果をもとに、商品制作案・画像構成・モックアップ改善案を提案してください。")}
    ${renderEmployeePanel(w,"kaku","✍️ カク","販売文章","Etsy向けの商品タイトル、タグ13個、説明文を作成してください。")}
    ${renderEmployeePanel(w,"gyou","💼 ギョウ","販売設計","価格、販売形式、出品時の確認事項、販売改善案を提案してください。")}
    ${renderEmployeePanel(w,"you","📱 ヨウ","Instagram宣伝","Instagram投稿文、ハッシュタグ、投稿構成を作成してください。公開は社長承認後にしてください。")}
    ${renderEmployeePanel(w,"matome","📊 マトメ","結果分析","販売・宣伝結果を整理し、良かった点、改善点、次の商品への提案をまとめてください。")}
    ${renderEmployeePanel(w,"chappy","🤖 チャッピー","統括","各AI社員の成果を整理し、社長が判断すべき点と次の行動をまとめてください。")}
    ${stepsHtml}
    <div class="action-row">
      <button class="action-btn reset" onclick="state.confirm={type:'reset',workId:'${w.id}'}; render();">↺ チェックをリセット</button>
      <button class="action-btn delete" onclick="state.confirm={type:'delete',workId:'${w.id}'}; render();">🗑 作品を削除</button>
    </div>
  `;
}

function renderShirabePanel(w){
  const s = (w.ai && w.ai.shirabe) || {request:"",result:"",status:"未依頼"};
  return `
    <section class="ai-panel">
      <h3>🔎 シラベ｜市場調査</h3>
      <p>商品案について何を調べるかを保存し、シラベの調査結果をこの作品に引き継ぎます。</p>
      <label>調査依頼</label>
      <textarea id="shirabe-request" placeholder="例：海外で和柄スマホ壁紙の需要・競合・価格帯を調査">${escapeHtml(s.request||"")}</textarea>
      <div class="ai-status">状態：${escapeHtml(s.status||"未依頼")}</div>
      <label>調査結果</label>
      <textarea id="shirabe-result" placeholder="シラベの調査結果をここに保存">${escapeHtml(s.result||"")}</textarea>
      <div class="ai-actions">
        <button id="shirabe-run" class="ai-run" onclick="runShirabe('${w.id}')">🔎 シラベに調査を依頼</button>
        <button class="ai-save" onclick="saveShirabe('${w.id}')">シラベ情報を保存</button>
        <button class="ai-complete" onclick="completeShirabe('${w.id}')">調査完了 → サクへ</button>
      </div>
    </section>`;
}


const EMPLOYEE_STEP_MAP = {
  saku:[2,4],
  gyou:[3,8],
  kaku:[5,6,7],
  you:[11],
  matome:[12],
  chappy:[0]
};
function renderEmployeePanel(w,key,name,job,defaultRequest){
  const a=(w.ai&&w.ai[key])||{request:"",result:"",status:"未依頼"};
  const req=a.request||defaultRequest;
  return `
    <section class="ai-panel">
      <h3>${name}｜${job}</h3>
      <p>前工程の情報を引き継ぎ、AI社員が担当業務を実行します。</p>
      <label>依頼内容</label>
      <textarea id="${key}-request">${escapeHtml(req)}</textarea>
      <div class="ai-status">状態：${escapeHtml(a.status||"未依頼")}</div>
      <label>成果</label>
      <textarea id="${key}-result" placeholder="${name}の成果をここに保存">${escapeHtml(a.result||"")}</textarea>
      <div class="ai-actions">
        <button id="${key}-run" class="ai-run" onclick="runEmployee('${w.id}','${key}','${name}')">${name}に依頼</button>
        <button class="ai-save" onclick="saveEmployee('${w.id}','${key}')">成果を保存</button>
        <button class="ai-complete" onclick="completeEmployee('${w.id}','${key}')">担当工程を完了</button>
      </div>
    </section>`;
}
function employeeContext(w,key){
  const order=["shirabe","saku","gyou","kaku","you","matome"];
  return order.filter(k=>k!==key && w.ai && w.ai[k] && w.ai[k].result)
    .map(k=>k.toUpperCase()+"の成果:\n"+w.ai[k].result).join("\n\n");
}
function saveEmployee(workId,key){
  const w=state.works.find(x=>x.id===workId); if(!w) return;
  const request=document.getElementById(key+"-request").value.trim();
  const result=document.getElementById(key+"-result").value.trim();
  w.ai[key]={request,result,status:result?"成果あり":"依頼準備済み"};
  persist(); render();
}
async function runEmployee(workId,key,name){
  const w=state.works.find(x=>x.id===workId); if(!w) return;
  const request=document.getElementById(key+"-request").value.trim();
  if(!request){ alert(name+"への依頼内容を入力してください。"); return; }
  const button=document.getElementById(key+"-run");
  if(button){ button.disabled=true; button.textContent=name+"が作業中…"; }
  const oldResult=(w.ai[key]&&w.ai[key].result)||"";
  w.ai[key]={request,result:oldResult,status:"作業中"}; persist();
  try{
    if(typeof window.requestCompanyAI!=="function") throw new Error("AI接続の準備ができていません");
    const context=employeeContext(w,key);
    const result=await window.requestCompanyAI(w.name,name,request,context);
    w.ai[key]={request,result,status:"成果あり"};
    persist(); render();
  }catch(error){
    console.error(name+"実行エラー",error);
    w.ai[key]={request,result:oldResult,status:"エラー"};
    persist(); render();
    alert(error instanceof Error?error.message:name+"の作業に失敗しました。");
  }
}
function completeEmployee(workId,key){
  const w=state.works.find(x=>x.id===workId); if(!w) return;
  const request=document.getElementById(key+"-request").value.trim();
  const result=document.getElementById(key+"-result").value.trim();
  if(!result){ alert("成果を作成してから完了してください。"); return; }
  w.ai[key]={request,result,status:"完了"};
  (EMPLOYEE_STEP_MAP[key]||[]).forEach(i=>w.steps[i]=true);
  persist(); render();
}

function saveShirabe(workId){
  const w=state.works.find(x=>x.id===workId); if(!w) return;
  if(!w.ai) w.ai={};
  const request=document.getElementById("shirabe-request").value.trim();
  const result=document.getElementById("shirabe-result").value.trim();
  w.ai.shirabe={request,result,status:result?"調査結果あり":"依頼準備済み"};
  persist(); render();
}
async function runShirabe(workId){
  const w=state.works.find(x=>x.id===workId); if(!w) return;
  const request=document.getElementById("shirabe-request").value.trim();
  if(!request){ alert("シラベへの調査依頼を入力してください。"); return; }
  const button=document.getElementById("shirabe-run");
  if(button){ button.disabled=true; button.textContent="🔎 シラベが調査中…"; }
  if(!w.ai) w.ai={};
  const oldResult=(w.ai.shirabe && w.ai.shirabe.result) || "";
  w.ai.shirabe={request,result:oldResult,status:"調査中"};
  persist();
  try{
    if(typeof window.requestShirabeResearch!=="function") throw new Error("認証機能の準備ができていません");
    const result=await window.requestShirabeResearch(w.name, request);
    w.ai.shirabe={request,result,status:"調査結果あり"};
    persist(); render();
  }catch(error){
    console.error("シラベ調査エラー", error);
    w.ai.shirabe={request,result:oldResult,status:"エラー"};
    persist(); render();
    alert(error instanceof Error ? error.message : "シラベの調査に失敗しました。");
  }
}

function completeShirabe(workId){
  const w=state.works.find(x=>x.id===workId); if(!w) return;
  const request=document.getElementById("shirabe-request").value.trim();
  const result=document.getElementById("shirabe-result").value.trim();
  if(!request || !result){ alert("調査依頼と調査結果の両方を入力してから完了してください。"); return; }
  if(!w.ai) w.ai={};
  w.ai.shirabe={request,result,status:"完了"};
  w.steps[1]=true;
  persist(); render();
}

function renderNewModal(){
  return `
    <div class="overlay" onclick="if(event.target===this){state.showNew=false;render();}">
      <div class="modal" onclick="event.stopPropagation()">
        <h3>新しい作品</h3>
        <input id="new-work-name" placeholder="例：狐月" autofocus
          onkeydown="if(event.key==='Enter') submitNewWork();">
        <div class="modal-row">
          <button class="btn cancel" onclick="state.showNew=false; render();">キャンセル</button>
          <button class="btn confirm gold" onclick="submitNewWork()">作成する</button>
        </div>
      </div>
    </div>`;
}

function renderConfirmModal(){
  const c = state.confirm;
  const w = state.works.find(x=>x.id===c.workId);
  if(!w){ state.confirm=null; return ""; }
  const isDelete = c.type==="delete";
  return `
    <div class="overlay" onclick="if(event.target===this){state.confirm=null;render();}">
      <div class="modal" onclick="event.stopPropagation()">
        <h3>${isDelete? "作品を削除しますか？" : "チェックをリセットしますか？"}</h3>
        <p>${isDelete
          ? `「${escapeHtml(w.name)}」を削除すると、進捗データは元に戻せません。`
          : `「${escapeHtml(w.name)}」の13工程のチェックがすべて解除されます。作品自体は削除されません。`}</p>
        <div class="modal-row">
          <button class="btn cancel" onclick="state.confirm=null; render();">キャンセル</button>
          <button class="btn confirm ${isDelete?'danger':''}" onclick="${isDelete?'confirmDelete()':'confirmReset()'}">${isDelete?'削除する':'リセットする'}</button>
        </div>
      </div>
    </div>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---- 操作 ----
function submitNewWork(){
  const input = document.getElementById("new-work-name");
  const name = input.value.trim();
  if(!name) return;
  const newWork = { id: Date.now().toString(), name, steps: Array(STEPS.length).fill(false) };
  state.works.push(newWork);
  state.showNew = false;
  state.openId = newWork.id;
  persist();
  render();
}

function openWork(id){ state.openId = id; render(); }

function toggleStep(workId, idx){
  const w = state.works.find(x=>x.id===workId);
  if(!w) return;
  w.steps[idx] = !w.steps[idx];
  persist();
  render();
}

function confirmReset(){
  const w = state.works.find(x=>x.id===state.confirm.workId);
  if(w) w.steps = Array(STEPS.length).fill(false);
  state.confirm = null;
  persist();
  render();
}

function confirmDelete(){
  state.works = state.works.filter(x=>x.id!==state.confirm.workId);
  state.openId = null;
  state.confirm = null;
  persist();
  render();
}

const SHIRABE_ENDPOINT = "https://lkynzlittlxhbpvnuajw.supabase.co/functions/v1/shirabe-research";
async function requestShirabeResearch(productName, request) {
  const user = auth.currentUser;
  if (!user) throw new Error("Googleでログインしてください。");
  const idToken = await user.getIdToken(true);
  const response = await fetch(SHIRABE_ENDPOINT, {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + idToken,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ productName, request })
  });
  let data = {};
  try { data = await response.json(); } catch (_) {}
  if (!response.ok) {
    if (response.status === 401) throw new Error("本人認証に失敗しました。いったん再ログインしてください。");
    throw new Error(data.error || ("シラベの調査に失敗しました（" + response.status + "）"));
  }
  if (!data.result) throw new Error("シラベから調査結果を取得できませんでした。");
  return data.result;
}

async function requestCompanyAI(productName, employeeName, request, context) {
  // 現在の shirabe-research は request 最大2000文字。
  // 社員間の引継ぎが増えても依頼本文を削らずに済むよう、
  // 引継ぎ情報だけを末尾優先で圧縮して安全に収める。
  const prefix =
    "あなたは幻想AIカンパニーの「" + employeeName + "」です。担当業務として回答してください。\n" +
    "商品名: " + productName + "\n" +
    "社長からの依頼: " + request + "\n\n";
  const suffix =
    "\n\n重要: 引継ぎ情報にある追加商品・素材・機能は、社長が承認していない限り現行商品の仕様として断定しないでください。提案は提案と明記してください。推測や未確認のWeb情報も確認済みと表現しないでください。";
  const header = context ? "前工程からの引継ぎ（長い場合は直近部分を優先）:\n" : "";
  const maxRequestLength = 1950;
  const room = Math.max(0, maxRequestLength - prefix.length - suffix.length - header.length);
  let safeContext = context || "";
  if(safeContext.length > room){
    safeContext = "…（前半省略）\n" + safeContext.slice(-(Math.max(0,room-9)));
  }
  let fullRequest = prefix + (safeContext ? header + safeContext : "") + suffix;
  if(fullRequest.length > maxRequestLength){
    fullRequest = fullRequest.slice(0,maxRequestLength);
  }
  return requestShirabeResearch(productName, fullRequest);
}
