<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="light">
<title>AIカンパニー</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d0a12">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIカンパニー">
<style>
  :root{
    --bg:#0d0a12;
    --surface:#17121f;
    --surface2:#241a30;
    --gold:#e8c65c;
    --gold-soft:rgba(232,198,92,0.45);
    --purple:#8b5cf6;
    --purple-soft:rgba(139,92,246,0.35);
    --text:#f4e9d0;
    --text-dim:#b8aecb;
    --danger:#e08a9e;
    --danger-bg:#2a1420;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  header{padding:32px 20px 16px;}
  .eyebrow{font-size:11px;letter-spacing:0.3em;color:var(--purple);margin:0 0 4px;}
  h1{font-size:22px;font-weight:700;margin:0;font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;}
  main{padding:0 20px 120px;}

  /* --- 一覧 --- */
  .empty{
    margin-top:24px;padding:32px;text-align:center;color:#8b7fa3;
    border:1px dashed var(--gold-soft);border-radius:16px;font-size:14px;line-height:1.7;
  }
  .work-card{
    width:100%;text-align:left;display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid rgba(232,198,92,0.3);
    border-radius:16px;padding:14px;margin-bottom:12px;
    color:inherit;font:inherit;cursor:pointer;
  }
  .work-card:active{transform:scale(0.98);}
  .moon{
    position:relative;flex-shrink:0;border-radius:50%;
    background:var(--surface2);box-shadow:inset 0 0 0 1px var(--gold-soft);
    overflow:hidden;
  }
  .work-body{flex:1;min-width:0;}
  .work-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar{width:100%;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px;}
  .bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--gold));transition:width 400ms ease;}
  .work-count{font-size:14px;font-weight:600;white-space:nowrap;color:var(--text-dim);}
  .work-count.done{color:var(--gold);}

  .fab{
    position:fixed;right:20px;bottom:24px;display:flex;align-items:center;gap:8px;
    background:var(--gold);color:#1a1220;border:none;border-radius:999px;
    padding:16px 22px;font-size:15px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .fab:active{transform:scale(0.95);}

  /* --- 詳細 --- */
  .topbar{display:flex;align-items:center;gap:10px;padding:24px 16px 16px;}
  .back-btn{background:none;border:none;color:var(--gold);font-size:26px;padding:6px;line-height:1;}
  .detail-title{font-size:20px;font-weight:700;font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .progress-box{
    display:flex;align-items:center;gap:16px;background:var(--surface);
    border:1px solid rgba(232,198,92,0.3);border-radius:16px;padding:18px;margin:0 20px 20px;
  }
  .progress-count{font-size:17px;font-weight:700;margin-bottom:6px;}

  .next-banner{
    margin:0 20px 20px;padding:12px 16px;border-radius:16px;text-align:center;font-weight:700;
    background:rgba(139,92,246,0.15);color:#c9b8f0;border:1px solid var(--purple-soft);
  }
  .next-banner.done{background:rgba(232,198,92,0.16);color:var(--gold);border-color:var(--gold-soft);}

  .step{
    width:calc(100% - 40px);margin:0 20px 8px;display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--purple-soft);border-radius:12px;
    padding:16px;text-align:left;font-size:16px;color:var(--text);
  }
.step.checked{
  background:rgba(232,198,92,0.16);
  border-color:var(--gold-soft);
}
  .checkbox{
    width:30px;height:30px;flex-shrink:0;border-radius:8px;border:2px solid var(--purple);
    display:flex;align-items:center;justify-content:center;font-size:16px;color:#1a1220;
  }
  .step.checked .checkbox{background:var(--gold);border-color:var(--gold);}
  .step.checked .label{text-decoration:line-through;opacity:0.75;}
  .step-main{flex:1;min-width:0;}
  .owner{display:inline-block;margin-top:5px;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.04em;}
  .company-label{margin:0 20px 12px;color:var(--text-dim);font-size:12px;}
  .company-label strong{color:var(--gold);}
  .ai-panel{margin:0 20px 16px;padding:16px;background:var(--surface);border:1px solid var(--gold-soft);border-radius:16px;}
  .ai-panel h3{margin:0 0 6px;font-size:16px;color:var(--gold);}
  .ai-panel p{margin:0 0 12px;color:var(--text-dim);font-size:13px;line-height:1.6;}
  .ai-panel textarea{width:100%;min-height:90px;resize:vertical;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--purple-soft);color:var(--text);font:inherit;font-size:16px;outline:none;}
  .ai-status{display:inline-block;margin:10px 0;padding:5px 9px;border-radius:999px;background:var(--surface2);color:#c9b8f0;font-size:12px;font-weight:700;}
  .ai-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .ai-actions button{flex:1;min-width:120px;padding:12px;border:0;border-radius:10px;font-weight:700;font-size:14px;}
  .ai-save{background:var(--purple);color:white;}
  .ai-run{background:#3f2b66;color:white;}
  .ai-actions button:disabled{opacity:.55;cursor:wait;}
  .ai-complete{background:var(--gold);color:#1a1220;}
  .orchestrator{margin:0 20px 20px;padding:18px;background:linear-gradient(135deg,var(--surface),#21162d);border:1px solid var(--gold);border-radius:18px;}
  .orchestrator h2{margin:0 0 6px;font-size:18px;color:var(--gold);}
  .orchestrator p{margin:0 0 12px;color:var(--text-dim);font-size:13px;line-height:1.6;}
  .orchestrator textarea{width:100%;min-height:100px;resize:vertical;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--purple-soft);color:var(--text);font:inherit;font-size:16px;outline:none;}
  .relay-status{margin:12px 0;padding:10px 12px;border-radius:12px;background:var(--surface2);font-size:13px;line-height:1.6;}
  .relay-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .relay-actions button{flex:1;min-width:140px;padding:13px;border:0;border-radius:11px;font-weight:700;font-size:14px;}
  .relay-start{background:var(--gold);color:#1a1220;}
  .relay-stop{background:#5d385f;color:white;}
  .approval-panel{margin:0 20px 20px;padding:18px;background:var(--surface);border:1px solid var(--gold);border-radius:18px;}
  .approval-panel h2{margin:0 0 6px;font-size:18px;color:var(--gold);}
  .approval-panel p{margin:0 0 12px;color:var(--text-dim);font-size:13px;line-height:1.6;}
  .approval-summary{white-space:pre-wrap;padding:14px;border-radius:12px;background:var(--bg);border:1px solid var(--purple-soft);font-size:14px;line-height:1.7;margin-bottom:12px;}
  .approval-panel textarea{width:100%;min-height:90px;resize:vertical;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--purple-soft);color:var(--text);font:inherit;font-size:16px;outline:none;}
  .approval-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
  .approval-actions button{flex:1;min-width:130px;padding:13px;border:0;border-radius:11px;font-weight:700;font-size:14px;}
  .approve-btn{background:var(--gold);color:#1a1220;}
  .revise-btn{background:var(--purple);color:white;}
  .reject-btn{background:#5d385f;color:white;}

  .action-row{display:flex;gap:12px;margin:20px;}
  .action-btn{
    flex:1;padding:14px;border-radius:12px;border:none;font-size:14px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .action-btn.reset{background:var(--surface2);color:#c9b8f0;}
  .action-btn.delete{background:var(--danger-bg);color:var(--danger);}

  /* --- モーダル --- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(2px);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px;
  }
  .modal{
    width:100%;max-width:380px;background:var(--surface);border:1px solid var(--gold-soft);
    border-radius:20px;padding:20px;margin-bottom:16px;
  }
  .modal h3{margin:0 0 8px;font-size:17px;}
  .modal p{margin:0 0 18px;font-size:14px;color:var(--text-dim);line-height:1.6;}
  .modal input{
    width:100%;padding:14px;border-radius:12px;background:var(--bg);
    border:1px solid var(--gold-soft);color:var(--text);font-size:16px;margin-bottom:16px;outline:none;
  }
  .modal-row{display:flex;gap:12px;}
  .btn{flex:1;padding:14px;border-radius:12px;border:none;font-size:14px;font-weight:600;}
  .btn.cancel{background:var(--surface2);color:#e6dcf5;}
  .btn.confirm{background:var(--purple);color:#fdf6e3;}
  .btn.confirm.gold{background:var(--gold);color:#1a1220;}
  .btn.confirm.danger{background:#7a2338;color:#fdf6e3;}
  .btn:disabled{opacity:0.4;}

  .toast{
    position:fixed;top:0;left:0;right:0;z-index:60;background:#7a2338;color:#fdf6e3;
    text-align:center;font-size:12px;padding:10px 12px;display:flex;justify-content:center;gap:12px;
  }
  .toast button{background:none;border:none;color:#fdf6e3;text-decoration:underline;font-weight:700;font-size:12px;}

/* 完了カードの色を強制指定 */
.step.checked {
  background: #5a461f !important;
  border-color: #e8c65c !important;
}

.step.checked .checkbox {
  background: #e8c65c !important;
  border-color: #e8c65c !important;
  color: #1a1220 !important;
}

.step.checked .label {
  color: #fff4cf !important;
  opacity: 1 !important;
}
html {
  color-scheme: only light !important;
}

body {
  color-scheme: only light !important;
}
</style>
</head>
<body>
<div id="toast-area"></div>
<div id="app"></div>

<script>
const STEPS = [
  { label:"企画", owner:"チャッピー＋くのぎ" },
  { label:"調査", owner:"シラベ" },
  { label:"制作", owner:"サク" },
  { label:"販売データ作成", owner:"ギョウ" },
  { label:"商品画像", owner:"サク" },
  { label:"タイトル", owner:"カク" },
  { label:"タグ", owner:"カク" },
  { label:"説明文", owner:"カク" },
  { label:"価格", owner:"ギョウ" },
  { label:"最終確認", owner:"くのぎ（社長）" },
  { label:"出品", owner:"ギョウ" },
  { label:"Instagram宣伝", owner:"ヨウ" },
  { label:"結果分析", owner:"マトメ" }
];
const STORAGE_KEY = "gensou-flow-works-v1";

// ---- ローカル保存（このブラウザ/端末だけに残る） ----
function loadWorks(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    console.error("読み込みエラー", e);
    return [];
  }
}
function saveWorks(works){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(works));
    return true;
  }catch(e){
    console.error("保存エラー", e);
    return false;
  }
}

let state = {
  works: loadWorks(),
  openId: null,
  showNew: false,
  confirm: null // {type:'delete'|'reset', workId}
};

function persist(){
  const ok = saveWorks(state.works);
  saveWorksToCloud(state.works);
  const toastArea = document.getElementById("toast-area");
  toastArea.innerHTML = ok ? "" : `
    <div class="toast">
      <span>保存に失敗しました（この端末の空き容量をご確認ください）</span>
      <button onclick="persist()">再試行する</button>
    </div>`;
}

function normalizeWorks(){
  let migrated=false;
  state.works.forEach(w=>{
    if(!Array.isArray(w.steps)) w.steps = [];
    while(w.steps.length < STEPS.length) w.steps.push(false);
    if(w.steps.length > STEPS.length) w.steps = w.steps.slice(0, STEPS.length);
    if(!w.ai) w.ai = {};
    if(!w.orchestration) w.orchestration = { request:"", status:"未開始", current:"" };
    if(!w.approval) w.approval = { recommendation:"", status:"未決裁", note:"" };
    // 旧「幻想フロー」の狐月部屋を、AIカンパニーのプロジェクト名へ一度だけ移行
    if(!w.projectModelMigrated){
      if(w.name==="幻想幽境-狐月-" || w.name==="幻想幽境 -狐月-" || w.name==="幻想幽境－狐月－" || w.name==="狐月"){
        w.name="狐月｜販売改善";
      }
      w.projectModelMigrated=true;
      migrated=true;
    }
    if(!w.ai.shirabe) w.ai.shirabe = { request:"", result:"", status:"未依頼" };
    ["saku","kaku","gyou","you","matome","chappy"].forEach(key=>{
      if(!w.ai[key]) w.ai[key] = { request:"", result:"", status:"未依頼" };
    });
  });
  if(migrated){
    saveWorks(state.works);
    saveWorksToCloud(state.works);
  }
}
function render(){
  normalizeWorks();
  const app = document.getElementById("app");
  app.innerHTML = state.openId ? renderDetail() : renderList();
  if(state.showNew) app.innerHTML += renderNewModal();
  if(state.confirm) app.innerHTML += renderConfirmModal();
}

function moonHtml(ratio, size){
  const pct = Math.round(ratio * 100);
  return `<div class="moon" style="
    width:${size}px;
    height:${size}px;
    background:linear-gradient(
      to right,
      #fff2a8 0%,
      #ffd95a ${pct}%,
      #241a30 ${pct}%,
      #241a30 100%
    );
  "></div>`;
}

function downloadBackup(){
  const payload={version:1,exportedAt:new Date().toISOString(),works:state.works};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="ai-company-backup.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
window.downloadBackup=downloadBackup;

async function restoreBackupFile(file){
  if(!file) return;
  try{
    const data=JSON.parse(await file.text());
    const works=Array.isArray(data)?data:(Array.isArray(data.works)?data.works:null);
    if(!works) throw new Error("バックアップ形式が正しくありません。");
    if(!confirm("現在のプロジェクトをバックアップ内容で復元しますか？")) return;
    state.works=works; state.openId=null;
    saveWorks(state.works);
    await saveWorksToCloud(state.works);
    render(); renderAccountStatus(auth.currentUser);
    alert("バックアップから復元しました。");
  }catch(e){ alert("復元に失敗しました："+e.message); }
}
window.restoreBackupFile=restoreBackupFile;

async function restoreKogetsuRecovery(){
  if(state.works.length>0){ alert("既存プロジェクトがあるため自動復旧は実行しません。"); return; }
  if(!confirm("確認できた履歴から「狐月｜販売改善」を復旧しますか？")) return;
  const researchRequest=`「彼岸の門」についてEtsy需要・競合（red spider lily / Japanese fantasy / dark forest / shrine / otherworld）、英語検索語、商品形式・価格・セット数・画像サイズ、彼岸花の文化的意味と海外名称、狐月と異なる独自デザイン案3案、AIアートの現行マーケットプレイス規約を調査してください。出品数と実売は区別し、売上を確認できない場合は需要があると断定しないでください。事実・提案・未確認を分離し、調査日・出典URLを示してください。結論→理由→数字の順で整理し、最後に進行/修正判断、推奨商品形式1つ、制作案3つと推奨案、次の作業1〜3個と完了基準を示してください。今回は調査・企画整理まで。画像生成・出品・公開は行わないでください。`;
  const w={id:"kogetsu-recovered-"+Date.now(),name:"狐月｜販売改善",steps:Array(STEPS.length).fill(false),projectModelMigrated:true,
    orchestration:{request:researchRequest,status:"復旧済み・再確認待ち",current:""},
    approval:{recommendation:"",status:"未決裁",note:"履歴から復旧。消失前の決裁状態は確認できないため未決裁。"},
    ai:{
      shirabe:{request:researchRequest,result:"",status:"再確認待ち"},
      saku:{request:"",result:"",status:"未依頼"},kaku:{request:"",result:"",status:"未依頼"},gyou:{request:"",result:"",status:"未依頼"},
      you:{request:"",result:"",status:"未依頼"},matome:{request:"",result:"",status:"未依頼"},chappy:{request:"",result:"",status:"未依頼"}
    }};
  state.works=[w]; saveWorks(state.works); await saveWorksToCloud(state.works); render(); renderAccountStatus(auth.currentUser);
  alert("「狐月｜販売改善」を確認できた履歴から復旧しました。未確認だった工程・社員結果は空欄のままです。");
}
window.restoreKogetsuRecovery=restoreKogetsuRecovery;

function renderList(){
  const items = state.works.map(w=>{
    const done = w.steps.filter(Boolean).length;
    const ratio = done/STEPS.length;
    return `
      <button class="work-card" onclick="openWork('${w.id}')">
        ${moonHtml(ratio,44)}
        <div class="work-body">
          <div class="work-name">${escapeHtml(w.name)}</div>
          <div class="bar"><div class="bar-fill" style="width:${Math.round(ratio*100)}%"></div></div>
        </div>
        <div class="work-count ${done===STEPS.length?'done':''}">${done} / ${STEPS.length}</div>
      </button>`;
  }).join("");

  return `
    <header>
      <h1>AIカンパニー</h1>
      <div id="account-status" style="font-size:12px;opacity:.75;margin-top:6px;">アカウント確認中…</div>
      <button id="logout-button" onclick="logoutFromGoogle()" style="display:none;margin-top:8px;">ログアウト</button>
    </header>
    <main>
      ${state.works.length===0 ? `<div class="empty">まだプロジェクトがありません。<br>右下の「＋」から最初のプロジェクトを作成しましょう。</div>` : items}
    </main>
    <div style="margin:16px 20px 90px;display:flex;gap:8px;flex-wrap:wrap;">
      <button onclick="downloadBackup()" style="padding:10px 12px;">バックアップ保存</button>
      <label style="padding:10px 12px;background:#241a30;border-radius:8px;cursor:pointer;">バックアップ復元<input type="file" accept="application/json" style="display:none" onchange="restoreBackupFile(this.files[0]);this.value=''"></label>
      ${state.works.length===0 ? '<button onclick="restoreKogetsuRecovery()" style="padding:10px 12px;">狐月を履歴から復旧</button>' : ''}
    </div>
    <button class="fab" onclick="state.showNew=true; render();">＋ 新しいプロジェクト</button>
  `;
}

function renderDetail(){
  const w = state.works.find(x=>x.id===state.openId);
  if(!w){ state.openId=null; return renderList(); }
  const done = w.steps.filter(Boolean).length;
  const ratio = done/STEPS.length;
  const nextIndex = w.steps.findIndex(s=>!s);
  const allDone = nextIndex===-1;

  const stepsHtml = STEPS.map((label,i)=>{
    const checked = !!w.steps[i];
    return `
      <button class="step ${checked?'checked':''}" onclick="toggleStep('${w.id}',${i})">
        <span class="checkbox">${checked?'✓':''}</span>
        <span class="step-main">
          <span class="label">${i+1}. ${escapeHtml(label.label)}</span><br>
          <span class="owner">担当：${escapeHtml(label.owner)}</span>
        </span>
      </button>`;
  }).join("");

  return `
    <div class="topbar">
      <button class="back-btn" onclick="state.openId=null; render();">‹</button>
      <div class="detail-title">${escapeHtml(w.name)}</div>
    </div>
    <div class="progress-box">
      ${moonHtml(ratio,56)}
      <div style="flex:1">
        <div class="progress-count">${done} / ${STEPS.length} 完了</div>
        <div class="bar"><div class="bar-fill" style="width:${Math.round(ratio*100)}%"></div></div>
      </div>
    </div>
    <div class="next-banner ${allDone?'done':''}">
      ${allDone ? "🎉 全工程完了！" : `次は『${escapeHtml(STEPS[nextIndex].label)}』｜担当：${escapeHtml(STEPS[nextIndex].owner)}`}
    </div>
    <div class="company-label"><strong>AIカンパニー工程</strong> — 社員ごとの担当をつないで進行</div>
    ${renderOrchestratorPanel(w)}
    ${renderApprovalPanel(w)}
    ${renderInstagramWorkspace(w)}
    ${renderShirabePanel(w)}

function getRelayJobs(masterRequest){
  const normalized=String(masterRequest||"").replace(/\s+/g,"");
  const only=/だけ|のみ|まで/.test(normalized);
  const researchPlanningOnly=
    /調査(?:と|・)?企画整理まで/.test(normalized) ||
    /調査(?:と|・)?企画(?:の)?整理まで/.test(normalized) ||
    (/調査/.test(normalized) && /企画整理/.test(normalized) && /まで/.test(normalized));
  if(researchPlanningOnly) return AUTO_RELAY.filter(job=>["shirabe","matome","chappy"].includes(job.key));
  // Explicitly scoped requests should not wake unrelated employees.
  if(only && /調査|市場|競合|需要/.test(normalized)) return AUTO_RELAY.filter(job=>["shirabe","matome","chappy"].includes(job.key));
  if(only && /デザイン|制作案|画像案|モック/.test(normalized)) return AUTO_RELAY.filter(job=>["saku","matome","chappy"].includes(job.key));
  if(only && /文章|説明文|タイトル|タグ/.test(normalized)) return AUTO_RELAY.filter(job=>["kaku","matome","chappy"].includes(job.key));
  if(only && /価格|販売|出品案/.test(normalized)) return AUTO_RELAY.filter(job=>["gyou","matome","chappy"].includes(job.key));
  if(only && /Instagram|インスタ|SNS|投稿文/.test(normalized)) return AUTO_RELAY.filter(job=>["you","matome","chappy"].includes(job.key));
  return AUTO_RELAY;
}

function extractYouInstagramCaption(result){
  const text=String(result||"").trim();
  const tagged=text.match(/【INSTAGRAM_POST】([\s\S]*?)【\/INSTAGRAM_POST】/);
  if(tagged?.[1]?.trim()) return {caption:tagged[1].trim(),source:"新形式"};
  const lines=text.split(/\r?\n/);
  const start=lines.findIndex(line=>/^\s*(?:#{1,6}\s*)?(?:\*\*)?(?:📱\s*)?(?:Instagram|インスタグラム)?(?:用)?(?:の)?投稿文(?:案)?(?:\*\*)?\s*[：:]?\s*$/i.test(line.trim()) && /投稿文/.test(line));
  if(start<0)return {caption:"",source:"旧形式・抽出対象なし"};
  const selected=[];
  for(const line of lines.slice(start+1)){
    if(selected.some(x=>x.trim()) && /^\s*(?:#{1,6}\s+|【[^】]+】|(?:画像構成|投稿方針|補足|理由|注意点|分析|次のステップ)\s*[：:])/.test(line))break;
    selected.push(line);
    if(selected.length>=40)break;
  }
  const caption=selected.join("\n").trim();
  return {caption:caption.length>=10?caption:"",source:"旧形式・要確認"};
}

async function prepareInstagramApproval(workId){
  const w=state.works.find(x=>x.id===workId),output=document.getElementById("ig-server-status");

  const caption=document.getElementById("ig-caption")?.value.trim()||"";

  if(!caption||!image_url){output.textContent="投稿文と画像URLが必要です。";return;}
  const request_key=crypto.randomUUID();
  output.textContent="サーバーへ申請登録中…";
  try {
    const r=await sendInstagramGuard({action:"prepare",project_id:workId,request_key,caption,image_url});
    if(!r.prepared)throw Error("申請を登録できませんでした");
    w.instagramPublishRequest={request_key,caption,image_url,status:"prepared"};
    persist();
    output.textContent="申請登録済み。未公開です。次に投稿内容を確認してサーバー承認できます。";
  }catch(e){output.textContent="登録失敗："+(e.message||String(e));}
}
async function approveInstagramServerSide(workId){
  const w=state.works.find(x=>x.id===workId),output=document.getElementById("ig-server-status");
  if(!w||!output)return;
  const pending=w.instagramPublishRequest;
  if(w.approval?.status!=="承認"||!pending){output.textContent="先に承認と申請登録が必要です。";return;}
  const caption=document.getElementById("ig-caption")?.value.trim()||"";
  const image_url=document.getElementById("ig-image-url")?.value.trim()||"";
  if(caption!==pending.caption||image_url!==pending.image_url){output.textContent="申請後に内容が変更されています。新しく申請登録してください。";return;}
  if(!confirm("この投稿文と画像をサーバーに承認記録しますか？Instagramへの公開は行いません。"))return;
  output.textContent="サーバーへ承認記録中…";
  try{
    const r=await sendInstagramGuard({action:"approve",project_id:workId,request_key:pending.request_key,caption,image_url,confirmation:"この投稿内容を承認する"});
    if(!r.approved)throw Error("承認できませんでした");
    w.instagramPublishRequest={...pending,status:"approved"};
    persist();
    output.textContent="サーバー承認記録済み。Instagramへの投稿は行っていません。";
  }catch(e){output.textContent="承認失敗："+(e.message||String(e));}
}

function decideApproval(workId,decision){

function employeeContext(w,key){
  const order=["shirabe","saku","gyou","kaku","you","matome"];
  return order.filter(k=>k!==key && w.ai && w.ai[k] && w.ai[k].result)
    .map(k=>k.toUpperCase()+"の成果:\n"+w.ai[k].result).join("\n\n");
}
function saveEmployee(workId,key){
  const w=state.works.find(x=>x.id===workId); if(!w) return;
  const request=document.getElementById(key+"-request").value.trim();
  const result=document.getElementById(key+"-result").value.trim();
  w.ai[key]={request,result,status:result?"成果あり":"依頼準備済み"};

}
async function runEmployee(workId,key,name){

  if(button){ button.disabled=true; button.textContent=name+"が作業中…"; }

function completeEmployee(workId,key){

  const w=state.works.find(x=>x.id===workId); if(!w) return;
  const request=document.getElementById("shirabe-request").value.trim();
  const result=document.getElementById("shirabe-result").value.trim();
  if(!request || !result){ alert("調査依頼と調査結果の両方を入力してから完了してください。"); return; }
  if(!w.ai) w.ai={};
  w.ai.shirabe={request,result,status:"完了"};
  w.steps[1]=true;
  persist(); render();
}

function renderNewModal(){
  return `
    <div class="overlay" onclick="if(event.target===this){state.showNew=false;render();}">
      <div class="modal" onclick="event.stopPropagation()">
        <h3>新しいプロジェクト</h3>

          onkeydown="if(event.key==='Enter') submitNewWork();">
        <div class="modal-row">
          <button class="btn cancel" onclick="state.showNew=false; render();">キャンセル</button>
          <button class="btn confirm gold" onclick="submitNewWork()">作成する</button>
        </div>
      </div>
    </div>`;
}

function renderConfirmModal(){
  const c = state.confirm;
  const w = state.works.find(x=>x.id===c.workId);
  if(!w){ state.confirm=null; return ""; }
  const isDelete = c.type==="delete";
  return `
    <div class="overlay" onclick="if(event.target===this){state.confirm=null;render();}">
      <div class="modal" onclick="event.stopPropagation()">
        <h3>${isDelete? "プロジェクトを削除しますか？" : "チェックをリセットしますか？"}</h3>
        <p>${isDelete
          ? `「${escapeHtml(w.name)}」を削除すると、プロジェクト内の進捗・AI社員の成果データは元に戻せません。`
          : `「${escapeHtml(w.name)}」の13工程のチェックがすべて解除されます。プロジェクト自体は削除されません。`}</p>
        <div class="modal-row">
          <button class="btn cancel" onclick="state.confirm=null; render();">キャンセル</button>
          <button class="btn confirm ${isDelete?'danger':''}" onclick="${isDelete?'confirmDelete()':'confirmReset()'}">${isDelete?'削除する':'リセットする'}</button>
        </div>
      </div>
    </div>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---- 操作 ----
function submitNewWork(){
  const input = document.getElementById("new-work-name");
  const name = input.value.trim();
  if(!name) return;
  const newWork = { id: Date.now().toString(), name, steps: Array(STEPS.length).fill(false) };
  state.works.push(newWork);
  state.showNew = false;
  state.openId = newWork.id;
  persist();
  render();
}

function openWork(id){ state.openId = id; render(); }

function toggleStep(workId, idx){
  const w = state.works.find(x=>x.id===workId);
  if(!w) return;
  w.steps[idx] = !w.steps[idx];
  persist();
  render();
}

function confirmReset(){
  const w = state.works.find(x=>x.id===state.confirm.workId);
  if(w) w.steps = Array(STEPS.length).fill(false);
  state.confirm = null;
  persist();
  render();
}

function confirmDelete(){
  state.works = state.works.filter(x=>x.id!==state.confirm.workId);
  state.openId = null;
  state.confirm = null;
  persist();
  render();
}

async function saveWorksToCloud(works) {
  const user = auth.currentUser;
  if (!user) return false;

  try {
    await setDoc(doc(db, "users", user.uid), {
      works: works
    });
    return true;
  } catch (e) {
    console.error("クラウド保存エラー", e);
    return false;
  }
}
  window.saveWorksToCloud = saveWorksToCloud;
  async function loadWorksFromCloud() {
  const user = auth.currentUser;
  if (!user) return false;

  try {
    const localWorks = loadWorks();
    const snap = await getDoc(doc(db, "users", user.uid));

    if (!snap.exists()) {
      // 初回移行: この端末に既存データがあれば、空のクラウドで上書きせず先にバックアップする。
      if (localWorks.length > 0) {
        state.works = localWorks;
        await saveWorksToCloud(localWorks);
      }
      render();
      renderAccountStatus(user);
      return true;
    }

    const data = snap.data();
    const cloudWorks = Array.isArray(data.works) ? data.works : [];

    if (localWorks.length > 0) {
      // 復旧保護: この端末に既存プロジェクトがある場合はローカルを正本として保持する。
      // クラウドが空でも古い内容でも、ログイン直後にローカルを消さず再バックアップする。
      state.works = localWorks;
      await saveWorksToCloud(localWorks);
    } else if (cloudWorks.length > 0) {
      // 新規端末（ローカル0件）のみクラウドから復元する。
      state.works = cloudWorks;
      saveWorks(state.works);
    } else {
      state.works = [];
    }

    render();
    renderAccountStatus(user);
    return true;
  } catch (e) {
    console.error("クラウド読込エラー", e);
    return false;
  }
}
