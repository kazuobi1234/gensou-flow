<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="light">
<title>AIカンパニー</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d0a12">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIカンパニー">
<style>
  :root{
    --bg:#0d0a12;
    --surface:#17121f;
    --surface2:#241a30;
    --gold:#e8c65c;
    --gold-soft:rgba(232,198,92,0.45);
    --purple:#8b5cf6;
    --purple-soft:rgba(139,92,246,0.35);
    --text:#f4e9d0;
    --text-dim:#b8aecb;
    --danger:#e08a9e;
    --danger-bg:#2a1420;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  header{padding:32px 20px 16px;}
  .eyebrow{font-size:11px;letter-spacing:0.3em;color:var(--purple);margin:0 0 4px;}
  h1{font-size:22px;font-weight:700;margin:0;font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;}
  main{padding:0 20px 120px;}

  /* --- 一覧 --- */
  .empty{
    margin-top:24px;padding:32px;text-align:center;color:#8b7fa3;
    border:1px dashed var(--gold-soft);border-radius:16px;font-size:14px;line-height:1.7;
  }
  .work-card{
    width:100%;text-align:left;display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid rgba(232,198,92,0.3);
    border-radius:16px;padding:14px;margin-bottom:12px;
    color:inherit;font:inherit;cursor:pointer;
  }
  .work-card:active{transform:scale(0.98);}
  .moon{
    position:relative;flex-shrink:0;border-radius:50%;
    background:var(--surface2);box-shadow:inset 0 0 0 1px var(--gold-soft);
    overflow:hidden;
  }
  .work-body{flex:1;min-width:0;}
  .work-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar{width:100%;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px;}
  .bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--gold));transition:width 400ms ease;}
  .work-count{font-size:14px;font-weight:600;white-space:nowrap;color:var(--text-dim);}
  .work-count.done{color:var(--gold);}

  .fab{
    position:fixed;right:20px;bottom:24px;display:flex;align-items:center;gap:8px;
    background:var(--gold);color:#1a1220;border:none;border-radius:999px;
    padding:16px 22px;font-size:15px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .fab:active{transform:scale(0.95);}

  /* --- 詳細 --- */
  .topbar{display:flex;align-items:center;gap:10px;padding:24px 16px 16px;}
  .back-btn{background:none;border:none;color:var(--gold);font-size:26px;padding:6px;line-height:1;}
  .detail-title{font-size:20px;font-weight:700;font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .progress-box{
    display:flex;align-items:center;gap:16px;background:var(--surface);
    border:1px solid rgba(232,198,92,0.3);border-radius:16px;padding:18px;margin:0 20px 20px;
  }
  .progress-count{font-size:17px;font-weight:700;margin-bottom:6px;}

  .next-banner{
    margin:0 20px 20px;padding:12px 16px;border-radius:16px;text-align:center;font-weight:700;
    background:rgba(139,92,246,0.15);color:#c9b8f0;border:1px solid var(--purple-soft);
  }
  .next-banner.done{background:rgba(232,198,92,0.16);color:var(--gold);border-color:var(--gold-soft);}

  .step{
    width:calc(100% - 40px);margin:0 20px 8px;display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--purple-soft);border-radius:12px;
    padding:16px;text-align:left;font-size:16px;color:var(--text);
  }
.step.checked{
  background:rgba(232,198,92,0.16);
  border-color:var(--gold-soft);
}
  .checkbox{
    width:30px;height:30px;flex-shrink:0;border-radius:8px;border:2px solid var(--purple);
    display:flex;align-items:center;justify-content:center;font-size:16px;color:#1a1220;
  }
  .step.checked .checkbox{background:var(--gold);border-color:var(--gold);}
  .step.checked .label{text-decoration:line-through;opacity:0.75;}
  .step-main{flex:1;min-width:0;}
  .owner{display:inline-block;margin-top:5px;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.04em;}
  .company-label{margin:0 20px 12px;color:var(--text-dim);font-size:12px;}
  .company-label strong{color:var(--gold);}
  .ai-panel{margin:0 20px 16px;padding:16px;background:var(--surface);border:1px solid var(--gold-soft);border-radius:16px;}
  .ai-panel h3{margin:0 0 6px;font-size:16px;color:var(--gold);}
  .ai-panel p{margin:0 0 12px;color:var(--text-dim);font-size:13px;line-height:1.6;}
  .ai-panel textarea{width:100%;min-height:90px;resize:vertical;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--purple-soft);color:var(--text);font:inherit;font-size:16px;outline:none;}
  .ai-status{display:inline-block;margin:10px 0;padding:5px 9px;border-radius:999px;background:var(--surface2);color:#c9b8f0;font-size:12px;font-weight:700;}
  .ai-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .ai-actions button{flex:1;min-width:120px;padding:12px;border:0;border-radius:10px;font-weight:700;font-size:14px;}
  .ai-save{background:var(--purple);color:white;}
  .ai-run{background:#3f2b66;color:white;}
  .ai-actions button:disabled{opacity:.55;cursor:wait;}
  .ai-complete{background:var(--gold);color:#1a1220;}
  .orchestrator{margin:0 20px 20px;padding:18px;background:linear-gradient(135deg,var(--surface),#21162d);border:1px solid var(--gold);border-radius:18px;}
  .orchestrator h2{margin:0 0 6px;font-size:18px;color:var(--gold);}
  .orchestrator p{margin:0 0 12px;color:var(--text-dim);font-size:13px;line-height:1.6;}
  .orchestrator textarea{width:100%;min-height:100px;resize:vertical;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--purple-soft);color:var(--text);font:inherit;font-size:16px;outline:none;}
  .relay-status{margin:12px 0;padding:10px 12px;border-radius:12px;background:var(--surface2);font-size:13px;line-height:1.6;}
  .relay-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .relay-actions button{flex:1;min-width:140px;padding:13px;border:0;border-radius:11px;font-weight:700;font-size:14px;}
  .relay-start{background:var(--gold);color:#1a1220;}
  .relay-stop{background:#5d385f;color:white;}
  .approval-panel{margin:0 20px 20px;padding:18px;background:var(--surface);border:1px solid var(--gold);border-radius:18px;}
  .approval-panel h2{margin:0 0 6px;font-size:18px;color:var(--gold);}
  .approval-panel p{margin:0 0 12px;color:var(--text-dim);font-size:13px;line-height:1.6;}
  .approval-summary{white-space:pre-wrap;padding:14px;border-radius:12px;background:var(--bg);border:1px solid var(--purple-soft);font-size:14px;line-height:1.7;margin-bottom:12px;}
  .approval-panel textarea{width:100%;min-height:90px;resize:vertical;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--purple-soft);color:var(--text);font:inherit;font-size:16px;outline:none;}
  .approval-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
  .approval-actions button{flex:1;min-width:130px;padding:13px;border:0;border-radius:11px;font-weight:700;font-size:14px;}
  .approve-btn{background:var(--gold);color:#1a1220;}
  .revise-btn{background:var(--purple);color:white;}
  .reject-btn{background:#5d385f;color:white;}

  .action-row{display:flex;gap:12px;margin:20px;}
  .action-btn{
    flex:1;padding:14px;border-radius:12px;border:none;font-size:14px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .action-btn.reset{background:var(--surface2);color:#c9b8f0;}
  .action-btn.delete{background:var(--danger-bg);color:var(--danger);}

  /* --- モーダル --- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(2px);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px;
  }
  .modal{
    width:100%;max-width:380px;background:var(--surface);border:1px solid var(--gold-soft);
    border-radius:20px;padding:20px;margin-bottom:16px;
  }
  .modal h3{margin:0 0 8px;font-size:17px;}
  .modal p{margin:0 0 18px;font-size:14px;color:var(--text-dim);line-height:1.6;}
  .modal input{
    width:100%;padding:14px;border-radius:12px;background:var(--bg);
    border:1px solid var(--gold-soft);color:var(--text);font-size:16px;margin-bottom:16px;outline:none;
  }
  .modal-row{display:flex;gap:12px;}
  .btn{flex:1;padding:14px;border-radius:12px;border:none;font-size:14px;font-weight:600;}
  .btn.cancel{background:var(--surface2);color:#e6dcf5;}
  .btn.confirm{background:var(--purple);color:#fdf6e3;}
  .btn.confirm.gold{background:var(--gold);color:#1a1220;}
  .btn.confirm.danger{background:#7a2338;color:#fdf6e3;}
  .btn:disabled{opacity:0.4;}

  .toast{
    position:fixed;top:0;left:0;right:0;z-index:60;background:#7a2338;color:#fdf6e3;
    text-align:center;font-size:12px;padding:10px 12px;display:flex;justify-content:center;gap:12px;
  }
  .toast button{background:none;border:none;color:#fdf6e3;text-decoration:underline;font-weight:700;font-size:12px;}

/* 完了カードの色を強制指定 */
.step.checked {
  background: #5a461f !important;
  border-color: #e8c65c !important;
}

.step.checked .checkbox {
  background: #e8c65c !important;
  border-color: #e8c65c !important;
  color: #1a1220 !important;
}

.step.checked .label {
  color: #fff4cf !important;
  opacity: 1 !important;
}
html {
  color-scheme: only light !important;
}

body {
  color-scheme: only light !important;
}
</style>
</head>
<body>
<div id="toast-area"></div>
<div id="app"></div>

<script>
const STEPS = [
  { label:"企画", owner:"チャッピー＋くのぎ" },
  { label:"調査", owner:"シラベ" },
  { label:"制作", owner:"サク" },
  { label:"販売データ作成", owner:"ギョウ" },
  { label:"商品画像", owner:"サク" },
  { label:"タイトル", owner:"カク" },
  { label:"タグ", owner:"カク" },
  { label:"説明文", owner:"カク" },
  { label:"価格", owner:"ギョウ" },
  { label:"最終確認", owner:"くのぎ（社長）" },
  { label:"出品", owner:"ギョウ" },
  { label:"Instagram宣伝", owner:"ヨウ" },
  { label:"結果分析", owner:"マトメ" }
];
const STORAGE_KEY = "gensou-flow-works-v1";

// ---- ローカル保存（このブラウザ/端末だけに残る） ----
function loadWorks(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    console.error("読み込みエラー", e);
    return [];
  }
}
function saveWorks(works){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(works));
    return true;
  }catch(e){
    console.error("保存エラー", e);
    return false;
  }
}

let state = {
  works: loadWorks(),
  openId: null,
  showNew: false,
  confirm: null // {type:'delete'|'reset', workId}
};

function saveSyncTestNote(){
 const w=state.works.find(x=>x.id===state.openId);
 if(!w||w.name!=="動作確認")return;
 const input=document.getElementById("sync-test-note"),out=document.getElementById("sync-test-result");
 if(!input||!out)return;
 w.syncTestNote=input.value.slice(0,200);
 const ok=saveWorks(state.works);
 if(!ok){out.textContent="端末への保存に失敗";return;}
 out.textContent="端末に保存しました。クラウドへの同期確認中…";
 enqueueCloudWrite(state.works).then(done=>{out.textContent=done?"✓ 端末・クラウドへ保存しました。":"⚠️ 端末には保存。クラウド同期は停止または失敗しています。";});
}
window.saveSyncTestNote=saveSyncTestNote;
function persist(){
  const ok = saveWorks(state.works);
  enqueueCloudWrite(state.works);
  const toastArea = document.getElementById("toast-area");
  toastArea.innerHTML = ok ? "" : `
    <div class="toast">
      <span>保存に失敗しました（この端末の空き容量をご確認ください）</span>
      <button onclick="persist()">再試行する</button>
    </div>`;
}

function normalizeWorks(){
  let migrated=false;
  state.works.forEach(w=>{
    if(!Array.isArray(w.steps)) w.steps = [];
    while(w.steps.length < STEPS.length) w.steps.push(false);
    if(w.steps.length > STEPS.length) w.steps = w.steps.slice(0, STEPS.length);
    if(!w.ai) w.ai = {};
    if(!w.orchestration) w.orchestration = { request:"", status:"未開始", current:"" };
    if(!w.approval) w.approval = { recommendation:"", status:"未決裁", note:"" };
    // 旧「幻想フロー」の狐月部屋を、AIカンパニーのプロジェクト名へ一度だけ移行
    if(!w.projectModelMigrated){
      if(w.name==="幻想幽境-狐月-" || w.name==="幻想幽境 -狐月-" || w.name==="幻想幽境－狐月－" || w.name==="狐月"){
        w.name="狐月｜販売改善";
      }
      w.projectModelMigrated=true;
      migrated=true;
    }
    if(!w.ai.shirabe) w.ai.shirabe = { request:"", result:"", status:"未依頼" };
    ["saku","kaku","gyou","you","matome","chappy"].forEach(key=>{
      if(!w.ai[key]) w.ai[key] = { request:"", result:"", status:"未依頼" };
    });
  });
  if(migrated){
    saveWorks(state.works);
    enqueueCloudWrite(state.works);
  }
}
function render(){
  normalizeWorks();
  const app = document.getElementById("app");
  app.innerHTML = state.openId ? renderDetail() : renderList();
  if(typeof window.showSyncStatus==="function") window.showSyncStatus();
  if(state.showNew) app.innerHTML += renderNewModal();
  if(state.confirm) app.innerHTML += renderConfirmModal();
  if(!state.openId && typeof window.refreshRemoteOnReturn==="function") queueMicrotask(()=>window.refreshRemoteOnReturn());
}

function moonHtml(ratio, size){
  const pct = Math.round(ratio * 100);
  return `<div class="moon" style="
    width:${size}px;
    height:${size}px;
    background:linear-gradient(
      to right,
      #fff2a8 0%,
      #ffd95a ${pct}%,
      #241a30 ${pct}%,
      #241a30 100%
    );
  "></div>`;
}

function downloadBackup(){
  const payload={version:1,exportedAt:new Date().toISOString(),works:state.works};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="ai-company-backup.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
window.downloadBackup=downloadBackup;

async function restoreBackupFile(file){
  if(!file) return;
  try{
    const data=JSON.parse(await file.text());
    const works=Array.isArray(data)?data:(Array.isArray(data.works)?data.works:null);
    if(!works) throw new Error("バックアップ形式が正しくありません。");
    if(!confirm("現在のプロジェクトをバックアップ内容で復元しますか？")) return;
    state.works=works; state.openId=null;
    saveWorks(state.works);
    await enqueueCloudWrite(state.works);
    render(); renderAccountStatus(auth.currentUser);
    alert("バックアップから復元しました。");
  }catch(e){ alert("復元に失敗しました："+e.message); }
}
window.restoreBackupFile=restoreBackupFile;

async function restoreKogetsuRecovery(){
  if(state.works.length>0){ alert("既存プロジェクトがあるため自動復旧は実行しません。"); return; }
  if(!confirm("確認できた履歴から「狐月｜販売改善」を復旧しますか？")) return;
  const researchRequest=`「彼岸の門」についてEtsy需要・競合（red spider lily / Japanese fantasy / dark forest / shrine / otherworld）、英語検索語、商品形式・価格・セット数・画像サイズ、彼岸花の文化的意味と海外名称、狐月と異なる独自デザイン案3案、AIアートの現行マーケットプレイス規約を調査してください。出品数と実売は区別し、売上を確認できない場合は需要があると断定しないでください。事実・提案・未確認を分離し、調査日・出典URLを示してください。結論→理由→数字の順で整理し、最後に進行/修正判断、推奨商品形式1つ、制作案3つと推奨案、次の作業1〜3個と完了基準を示してください。今回は調査・企画整理まで。画像生成・出品・公開は行わないでください。`;
  const w={id:"kogetsu-recovered-"+Date.now(),name:"狐月｜販売改善",steps:Array(STEPS.length).fill(false),projectModelMigrated:true,
    orchestration:{request:researchRequest,status:"復旧済み・再確認待ち",current:""},
    approval:{recommendation:"",status:"未決裁",note:"履歴から復旧。消失前の決裁状態は確認できないため未決裁。"},
    ai:{
      shirabe:{request:researchRequest,result:"",status:"再確認待ち"},
      saku:{request:"",result:"",status:"未依頼"},kaku:{request:"",result:"",status:"未依頼"},gyou:{request:"",result:"",status:"未依頼"},
      you:{request:"",result:"",status:"未依頼"},matome:{request:"",result:"",status:"未依頼"},chappy:{request:"",result:"",status:"未依頼"}
    }};
  state.works=[w]; saveWorks(state.works); await saveWorksToCloud(state.works); render(); renderAccountStatus(auth.currentUser);
  alert("「狐月｜販売改善」を確認できた履歴から復旧しました。未確認だった工程・社員結果は空欄のままです。");
}
window.restoreKogetsuRecovery=restoreKogetsuRecovery;

function renderList(){
  const items = state.works.map(w=>{
    const done = w.steps.filter(Boolean).length;
    const ratio = done/STEPS.length;
    return `
      <button class="work-card" onclick="openWork('${w.id}')">
        ${moonHtml(ratio,44)}
        <div class="work-body">
          <div class="work-name">${escapeHtml(w.name)}</div>
          <div class="bar"><div class="bar-fill" style="width:${Math.round(ratio*100)}%"></div></div>
        </div>
        <div class="work-count ${done===STEPS.length?'done':''}">${done} / ${STEPS.length}</div>
      </button>`;
  }).join("");

  return `
    <header>
      <h1>AIカンパニー</h1>
      <div id="account-status" style="font-size:12px;opacity:.75;margin-top:6px;">アカウント確認中…</div>
      <button id="logout-button" onclick="logoutFromGoogle()" style="display:none;margin-top:8px;">ログアウト</button>
    </header>
    <section style="margin:12px 20px;padding:14px;border:1px solid #67547f;border-radius:12px"><strong>☁️ 同期ステータス</strong><div id="sync-live-status" role="status" style="margin-top:8px">確認中（未検証）</div><div id="sync-last-check" style="font-size:12px;opacity:.75;margin-top:5px">最終確認：未確認</div><div style="font-size:12px;opacity:.75;margin-top:4px">競合がある場合は自動同期を停止します。</div></section>
    <main>
      ${state.works.length===0 ? `<div class="empty">まだプロジェクトがありません。<br>右下の「＋」から最初のプロジェクトを作成しましょう。</div>` : items}
    </main>
    <div style="margin:16px 20px 90px;display:flex;gap:8px;flex-wrap:wrap;">
      <button onclick="downloadBackup()" style="padding:10px 12px;">バックアップ保存</button>
      <button onclick="inspectCloudDifference()" style="padding:10px 12px;">🔍 クラウドとの差分を確認（読み取りのみ）</button><button onclick="refreshCloudSync()" style="padding:10px 12px;">🔄 同期状態を再確認</button><button onclick="importCloudWithBackup()" style="padding:10px 12px;">📥 クラウドから取り込む（バックアップ必須）</button><button onclick="resolveSyncConflict()" style="padding:10px 12px;">🛡️ 競合を解決（双方バックアップ・選択）</button>
      <p id="cloud-diff-status" role="status" style="width:100%;font-size:13px;white-space:pre-wrap">同期は安全のため停止中。確認ボタンはデータを変更しません。</p>
      <label style="padding:10px 12px;background:#241a30;border-radius:8px;cursor:pointer;">バックアップ復元<input type="file" accept="application/json" style="display:none" onchange="restoreBackupFile(this.files[0]);this.value=''"></label>

function getRelayJobs(masterRequest){
  const normalized=String(masterRequest||"").replace(/\s+/g,"");
  // Multiple named employee sections are a multi-department request, even when
  // individual sections contain "のみ", "まで", or "だけ".
  const explicitSections=[/【(?:調|シラベ)[｜|]/,/【(?:咲|サク)[｜|]/,/【(?:カク|書)[｜|]/,/【(?:暁|ヨウ)[｜|]/,/【(?:葉|ギョウ)[｜|]/,/【(?:まとめ|マトメ)[｜|]/,/【(?:チャッピー)[｜|]/];
  const assignedCount=explicitSections.filter(re=>re.test(normalized)).length;
  if(assignedCount>=3)return AUTO_RELAY;
  const only=/だけ|のみ|まで/.test(normalized);
  const researchPlanningOnly=
    /調査(?:と|・)?企画整理まで/.test(normalized) ||
    /調査(?:と|・)?企画(?:の)?整理まで/.test(normalized) ||
    (/調査/.test(normalized) && /企画整理/.test(normalized) && /まで/.test(normalized));
  if(researchPlanningOnly) return AUTO_RELAY.filter(job=>["shirabe","matome","chappy"].includes(job.key));
  // Explicitly scoped requests should not wake unrelated employees.
  if(only && /調査|市場|競合|需要/.test(normalized)) return AUTO_RELAY.filter(job=>["shirabe","matome","chappy"].includes(job.key));
  if(only && /デザイン|制作案|画像案|モック/.test(normalized)) return AUTO_RELAY.filter(job=>["saku","matome","chappy"].includes(job.key));
  if(only && /文章|説明文|タイトル|タグ/.test(normalized)) return AUTO_RELAY.filter(job=>["kaku","matome","chappy"].includes(job.key));
  if(only && /価格|販売|出品案/.test(normalized)) return AUTO_RELAY.filter(job=>["gyou","matome","chappy"].includes(job.key));
  if(only && /Instagram|インスタ|SNS|投稿文/.test(normalized)) return AUTO_RELAY.filter(job=>["you","matome","chappy"].includes(job.key));
  return AUTO_RELAY;
}

function extractYouInstagramCaption(result){
  const text=String(result||"").trim();
  const tagged=text.match(/【INSTAGRAM_POST】([\s\S]*?)【\/INSTAGRAM_POST】/);
  if(tagged?.[1]?.trim()) return {caption:tagged[1].trim(),source:"新形式"};
  const lines=text.split(/\r?\n/);
  const start=lines.findIndex(line=>/^\s*(?:#{1,6}\s*)?(?:\*\*)?(?:📱\s*)?(?:Instagram|インスタグラム)?(?:用)?(?:の)?投稿文(?:案)?(?:\*\*)?\s*[：:]?\s*$/i.test(line.trim()) && /投稿文/.test(line));
  if(start<0)return {caption:"",source:"旧形式・抽出対象なし"};
  const selected=[];
  for(const line of lines.slice(start+1)){
    if(selected.some(x=>x.trim()) && /^\s*(?:#{1,6}\s+|【[^】]+】|(?:画像構成|投稿方針|補足|理由|注意点|分析|次のステップ)\s*[：:])/.test(line))break;
    selected.push(line);
    if(selected.length>=40)break;
  }
  const caption=selected.join("\n").trim();
  return {caption:caption.length>=10?caption:"",source:"旧形式・要確認"};
}

 const out=document.getElementById("ig-convert-result"),input=document.getElementById("ig-convert-source");
 const file=input?.files?.[0];if(!out||!input)return;
 if(!file){out.textContent="元の画像ファイルを選んでください。";return;}
 if(!["image/png","image/webp","image/jpeg"].includes(file.type)||file.size>10*1024*1024){out.textContent="10MB以下のPNG・WebP・JPEG画像を選んでください。";return;}
 const button=out.parentElement?.querySelector('button[onclick="runInstagramJpegConversion()"]');
 if(button)button.disabled=true;
 let bitmap;
 try{
  if(typeof window.requestInstagramImageUpload!=="function")throw Error("アップロード機能が未接続です");
  out.textContent="変換中…";
  bitmap=await createImageBitmap(file);
  if(!bitmap.width||!bitmap.height||bitmap.width*bitmap.height>36000000)throw Error("画像サイズに対応していません");
  const ratio=Math.min(1,2048/Math.max(bitmap.width,bitmap.height));
  const canvas=document.createElement("canvas");
  canvas.width=Math.max(1,Math.round(bitmap.width*ratio));canvas.height=Math.max(1,Math.round(bitmap.height*ratio));
  const ctx=canvas.getContext("2d");if(!ctx)throw Error("画像処理に失敗しました");
  ctx.fillStyle="#ffffff";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",0.86));
  if(!blob||blob.type!=="image/jpeg"||blob.size>8000000)throw Error("JPEGを生成できません");
  out.textContent="JPEGを別ファイルとしてSupabaseに保存中…";
  const jpeg=new File([blob],file.name.replace(/\.[^.]+$/,"")+"-instagram.jpg",{type:"image/jpeg"});
  const result=await window.requestInstagramImageUpload(jpeg);
  if(!result?.image_url)throw Error("保存先URLが取得できません");
  const urlInput=document.getElementById("ig-diagnostic-image-url");
  if(urlInput)urlInput.value=result.image_url;
  out.textContent="✓ JPEG保存完了。元のPNGは残っています。\n"+canvas.width+"×"+canvas.height+" / "+(blob.size/1048576).toFixed(2)+"MB\n上のURL欄に保存先を入力済みです。「画像URLを検査」を押してください。\nInstagramへの投稿はしていません。";
 }catch(e){out.textContent="変換・保存に失敗："+(e.message||String(e))}
 finally{bitmap?.close?.();if(button)button.disabled=false}
}

async function prepareInstagramApproval(workId){

  const image_url=document.getElementById("ig-image-url")?.value.trim()||"";
  if(!caption||!image_url){output.textContent="投稿文と画像URLが必要です。";return;}
  const request_key=crypto.randomUUID();
  output.textContent="サーバーへ申請登録中…";
  try {
    const r=await sendInstagramGuard({action:"prepare",project_id:workId,request_key,caption,image_url});
    if(!r.prepared)throw Error("申請を登録できませんでした");
    w.instagramPublishRequest={request_key,caption,image_url,status:"prepared"};
    persist();
    output.textContent="申請登録済み。未公開です。次に投稿内容を確認してサーバー承認できます。";

async function approveInstagramServerSide(workId){

async function buildInstagramMockups(id){

  cc.fillStyle="#f5ddc3";cc.textAlign="center";cc.font="bold 66px serif";cc.fillText(title,540,110,990);cc.font="30px serif";cc.fillText("KUNOGI STUDIO  |  DIGITAL WALLPAPERS",540,162);
  const drawFit=(c,b,x,y,ww,hh)=>{const scale=Math.min(ww/b.width,hh/b.height);const dw=b.width*scale,dh=b.height*scale;c.drawImage(b,x+(ww-dw)/2,y+(hh-dh)/2,dw,dh);};
  for(let i=0;i<4;i++){const x=35+i*260,y=245;cc.fillStyle="#30223d";cc.fillRect(x,y,245,930);drawFit(cc,bitmaps[i],x,y,245,930);cc.font="22px sans-serif";cc.fillStyle="#e9d4c5";cc.fillText("0"+(i+1),x+122,1210);}
  cc.font="27px sans-serif";cc.fillText("4 ORIGINAL PHONE WALLPAPERS",540,1280);
  const canvases=[cover[0]];
  for(let i=0;i<4;i++){
   const [c,g]=makeCanvas(1080,1350);
   g.fillStyle="#130c23";g.fillRect(0,0,1080,1350);
   g.fillStyle="#372c40";g.fillRect(165,85,750,1170);
   g.fillStyle="#05060c";g.beginPath();g.roundRect(206,105,668,1130,64);g.fill();
   g.save();g.beginPath();g.roundRect(224,133,632,1070,38);g.clip();
   const b=bitmaps[i],scale=Math.max(632/b.width,1070/b.height);

   g.fillStyle="white";g.textAlign="center";g.font="32px sans-serif";g.fillText("09:41",540,245);
   g.font="22px sans-serif";g.fillText("KUNOGI STUDIO  •  0"+(i+1),540,1300);
   canvases.push(c);
  }
  const fileSignatures=files.map(f=>f.name+":"+f.size+":"+f.lastModified);

  const uploaded=Array.isArray(saved?.image_urls)?[...saved.image_urls]:[];

 }catch(err){status.textContent="制作を中断しました："+(err.message||String(err))+"。元画像はそのままです。途中保存分は投稿されません。";}finally{bitmaps.forEach(b=>b.close?.());btn.disabled=false;}

  const canvas=document.createElement("canvas");canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);
  const ctx=canvas.getContext("2d");ctx.fillStyle="white";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",.88));if(!blob||blob.size>8000000)throw Error("JPEG変換失敗");

 }finally{bitmap.close?.();}

function decideApproval(workId,decision){
  const w=state.works.find(x=>x.id===workId); if(!w) return;
  const noteEl=document.getElementById("approval-note");
  const note=(noteEl?noteEl.value:"").trim();
  if((decision==="一部修正" || decision==="差し戻し") && !note){
    alert("修正・差し戻し内容をメモに入力してください。");
    return;
  }
  w.approval={...(w.approval||{}),status:decision,note};
  if(decision==="承認"){
    w.steps[9]=true;
    w.orchestration.status="社長承認済み";

  }
  persist(); render();
}

let shirabeDiagnosticBusy=false;
async function diagnoseShirabeOnce(workId){
  const out=document.getElementById("shirabe-diagnostic-result");
  const w=state.works.find(x=>x.id===workId);
  if(!out||!w||shirabeDiagnosticBusy)return;
  if(!confirm("シラベAPIへテストを1回だけ送ります（再試行なし）。API利用量が発生する可能性があります。プロジェクトの進捗・成果は変更しません。続けますか？"))return;
  shirabeDiagnosticBusy=true;
  out.textContent="接続診断中（1回のみ）…";
  try{
    const result=await window.requestShirabeResearch("接続診断","接続確認です。短く『接続成功』だけ回答してください。市場調査は不要です。");
    out.textContent=result?"✅ シラベAPIが応答しました。実際の市場調査の成功までは保証しません。":"⚠️ 応答内容が空です。";
  }catch(error){
    const msg=String(error?.message||"原因未特定");
    const http=msg.match(/シラベAPI診断：HTTP\s*(\d{3})(?:\s*\/\s*Gemini HTTP\s*(\d{3}))?/);
    const category=http?.[2]==="503"?"Gemini側503（処理不可）":http?.[2]==="429"?"Gemini側429（利用制限）":http?.[2]==="404"?"Gemini側404（モデル・経路）":http?.[2]==="403"?"Gemini側403（権限）":"詳細は確認できません";
    out.textContent="⚠️ 診断失敗\nアプリ側HTTP："+(http?.[1]||"確認できません")+"\nGemini側HTTP："+(http?.[2]||"確認できません")+"\n分類："+category+"\n秘密情報は表示していません。";
  }finally{shirabeDiagnosticBusy=false;}
}
window.diagnoseShirabeOnce=diagnoseShirabeOnce;

  const summary=w=>w.name+" "+(Array.isArray(w.steps)?w.steps.filter(Boolean).length:0)+"/13";
  const lines=["【端末】"+(local.map(summary).join("、")||"なし"),"【クラウド】"+(cloud.map(summary).join("、")||"なし")];
  const lc=new Map(local.map(w=>[String(w.id),w])),cc=new Map(cloud.map(w=>[String(w.id),w]));
  const names=new Set([...lc.keys(),...cc.keys()]);
  const changes=[];
  function compare(x,y,path,depth){
    if(syncFingerprint(x)===syncFingerprint(y))return;
    if(depth>7){changes.push(path+"：詳細差分あり");return;}
    if(Array.isArray(x)&&Array.isArray(y)){
      for(let i=0;i<Math.max(x.length,y.length);i++)compare(x[i],y[i],path+"["+i+"]",depth+1);
    }else if(x&&y&&typeof x==="object"&&typeof y==="object"){
      for(const k of new Set([...Object.keys(x),...Object.keys(y)]))compare(x[k],y[k],path+"."+k,depth+1);
    }else changes.push(path+(x===undefined?"：端末に項目なし":y===undefined?"：クラウドに項目なし":"：内容が異なる"));
  }
  for(const id of names){
    const x=lc.get(id),y=cc.get(id);
    const name=x?.name||y?.name||"名称不明";
    if(!x||!y){changes.push(name+"："+(!x?"端末にのみ存在しない":"クラウドにのみ存在しない"));continue;}
    compare(x,y,name,0);
  }
  lines.push("【詳細差分】"+(changes.length?changes.length+"項目":"0項目（一致）"));
  lines.push(...changes.slice(0,60));
  if(changes.length>60)lines.push("ほか "+(changes.length-60)+"項目（表示省略）");
  lines.push("※値そのものや秘密情報は表示しません。読み取りのみ・同期停止中。");
  out.textContent=lines.join("\n");
  if(changes.length)setSyncStatus("⚠️ 差分あり（同期状態を確認してください）");
  else setSyncStatus(cloudSyncBlocked?"⏸️ データ一致・同期停止中":"✅ 同期済み（差分確認完了）",true);
 }catch(e){out.textContent="確認できません："+(e.message||String(e))}
}
window.inspectCloudDifference=inspectCloudDifference;
let cloudBaseline = null;
let liveSyncStop=null;
let pendingCloudWrites=0;
let remoteRefreshNeeded=false;
let syncQueue = Promise.resolve();
function enqueueCloudWrite(works){
 const snapshot=JSON.parse(syncFingerprint(works));
 pendingCloudWrites++;
 syncQueue=syncQueue.catch(()=>false).then(()=>saveWorksToCloud(snapshot)).finally(()=>{pendingCloudWrites=Math.max(0,pendingCloudWrites-1)});
 return syncQueue;
}
async function saveWorksToCloud(works){
 if(cloudSyncBlocked || cloudBaseline===null){setSyncStatus("⚠️ 同期停止中（確認が必要）");return false;}
 const user=auth.currentUser;if(!user)return false;
 const expected=cloudBaseline;
 setSyncStatus("🔄 同期中…");
 try{
  const ref=doc(db,"users",user.uid);
  await runTransaction(db,async(tx)=>{
   const snap=await tx.get(ref);
   const remote=snap.exists()&&Array.isArray(snap.data().works)?snap.data().works:[];
   if(syncFingerprint(remote)!==expected)throw Error("SYNC_CONFLICT");
   tx.set(ref,{works}, {merge:true});
  });
  cloudBaseline=syncFingerprint(works);
  setSyncStatus("✅ 同期済み（クラウド保存確認）",true);
  return true;
 }catch(e){
  cloudSyncBlocked=true;
  setSyncStatus("⚠️ 競合または保存失敗：同期停止中");
  console.warn("Cloud synchronization paused",e);
  alert("⚠️ 他の端末またはクラウドの内容が変わったため同期を停止しました。データを上書きしていません。両端末のバックアップを保存し、差分確認を行ってください。");
  return false;
 }
}
window.saveWorksToCloud=saveWorksToCloud;
window.enqueueCloudWrite=enqueueCloudWrite;
async function loadWorksFromCloud(){
 const user=auth.currentUser;if(!user)return false;
 cloudSyncBlocked=true;cloudBaseline=null;
 try{
  const local=loadWorks();
  const snap=await getDoc(doc(db,"users",user.uid));
  const remote=snap.exists()&&Array.isArray(snap.data().works)?snap.data().works:[];
  // Enable optimistic writes only if both sides match. Never overwrite divergent data.
  if(local.length===0 && remote.length>0){state.works=remote;saveWorks(remote);}
  else state.works=local;
  if(syncFingerprint(state.works)===syncFingerprint(remote)){
   cloudBaseline=syncFingerprint(remote);
   cloudSyncBlocked=false;
   setSyncStatus("✅ 同期済み（クラウドとの一致確認）",true);
  }else {setSyncStatus("⚠️ 差分あり：同期停止中");console.warn("Different local/cloud data; synchronization remains paused");}
  render();renderAccountStatus(user);return true;
 }catch(e){console.error("クラウド読込エラー",e);return false;}
}
function applyRemoteSafely(remote){
 if(cloudSyncBlocked||cloudBaseline===null||pendingCloudWrites>0)return false;
 const local=loadWorks();
 const localHash=syncFingerprint(local),remoteHash=syncFingerprint(remote);
 if(localHash===remoteHash){cloudBaseline=remoteHash;remoteRefreshNeeded=false;setSyncStatus("✅ 同期済み（変更確認済み）",true);return true;}
 if(localHash!==cloudBaseline){cloudSyncBlocked=true;setSyncStatus("⚠️ 競合あり：同期停止中");console.warn("Local unsynced changes: automatic import blocked");return false;}
 if(state.openId!==null||state.showNew||state.confirm){remoteRefreshNeeded=true;setSyncStatus("⏸️ 編集画面表示中：取り込み保留");return false;}
 if(!saveWorks(remote)){cloudSyncBlocked=true;return false;}
 state.works=remote;
 cloudBaseline=remoteHash;remoteRefreshNeeded=false;
 setSyncStatus("✅ 同期済み（自動取り込み確認）",true);
 render();renderAccountStatus(auth.currentUser);
 return true;
}
function startLiveCloudSync(user){
 if(liveSyncStop){liveSyncStop();liveSyncStop=null;}
 let first=true;
 liveSyncStop=onSnapshot(doc(db,"users",user.uid),snap=>{
  if(snap.metadata.hasPendingWrites)return;
  const remote=snap.exists()&&Array.isArray(snap.data().works)?snap.data().works:[];
  if(first){first=false;return;}
  applyRemoteSafely(remote);
 },error=>{cloudSyncBlocked=true;setSyncStatus("⚠️ 接続エラー：同期停止中");console.error("Cloud listener stopped",error)});
}
async function refreshRemoteOnReturn(){
 if(!remoteRefreshNeeded||state.openId!==null||cloudSyncBlocked||!auth.currentUser)return;
 await syncQueue.catch(()=>false);
 try{
  const snap=await getDoc(doc(db,"users",auth.currentUser.uid));
  applyRemoteSafely(snap.exists()&&Array.isArray(snap.data().works)?snap.data().works:[]);
 }catch(e){console.warn("Unable to refresh",e)}
}
window.refreshRemoteOnReturn=refreshRemoteOnReturn;
async function refreshCloudSync(){
 if(!auth.currentUser)return alert("ログインしてください");
 await syncQueue.catch(()=>false);
 const local=loadWorks();
 const snap=await getDoc(doc(db,"users",auth.currentUser.uid));
 const remote=snap.exists()&&Array.isArray(snap.data().works)?snap.data().works:[];
 if(syncFingerprint(local)===syncFingerprint(remote)){
  cloudBaseline=syncFingerprint(remote);cloudSyncBlocked=false;setSyncStatus("✅ 同期済み（再確認完了）",true);
  alert("✓ 端末とクラウドが一致。競合防止付き同期を再開しました。");
 }else{
  cloudSyncBlocked=true;setSyncStatus("⚠️ 差分あり：同期停止中");
  alert("端末とクラウドに内容の差分があります。安全のため同期を停止しました。詳細差分を確認してください。自動上書きは行いません。");
 }
}
window.refreshCloudSync=refreshCloudSync;
async function importCloudWithBackup(){
 const user=auth.currentUser;if(!user)return alert("ログインしてください");
 cloudSyncBlocked=true;
 try{
  await syncQueue.catch(()=>false);
  const local=loadWorks(),ref=doc(db,"users",user.uid);
  const before=await getDoc(ref),cloud=before.exists()&&Array.isArray(before.data().works)?before.data().works:[];
  if(!cloud.length)return alert("クラウドに取り込めるプロジェクトがありません。");
  if(syncFingerprint(local)===syncFingerprint(cloud)){
   cloudBaseline=syncFingerprint(cloud);cloudSyncBlocked=false;
   return alert("現在の端末とクラウドはすでに一致しています。");
  }
  const snapshotName="ai-company-before-cloud-import-"+new Date().toISOString().replace(/[:.]/g,"-")+".json";
  const data={version:1,exportedAt:new Date().toISOString(),source:"pre-cloud-import",works:local};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=snapshotName;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);
  alert("端末側のバックアップダウンロードを開始しました。ダウンロード一覧でファイルの保存完了を確認してください。");
  if(!confirm("バックアップ "+snapshotName+" が端末に保存されたことを確認しましたか？ 未確認ならキャンセルしてください。"))return;
  if(!confirm("クラウドのプロジェクト "+cloud.length+"件でこの端末のデータを置き換えます。端末固有の未同期の変更は上書きされます。実行しますか？"))return;
  const latest=await getDoc(ref),latestWorks=latest.exists()&&Array.isArray(latest.data().works)?latest.data().works:[];
  if(syncFingerprint(cloud)!==syncFingerprint(latestWorks))return alert("確認中にクラウドが変更されました。取り込みを中止しました。");
  if(!saveWorks(cloud))return alert("端末への保存に失敗しました。取り込みを中止しました。");
  state.works=cloud;state.openId=null;
  cloudBaseline=syncFingerprint(cloud);cloudSyncBlocked=false;
  render();renderAccountStatus(user);
  alert("クラウドのデータを端末へ取り込みました。バックアップは削除しないでください。");
 }catch(e){cloudSyncBlocked=true;alert("取り込みを中止しました："+(e.message||String(e)));}
}
window.importCloudWithBackup=importCloudWithBackup;

function saveSyncSafetyFile(works, side){
 const fileName="ai-company-conflict-"+side+"-"+new Date().toISOString().replace(/[:.]/g,"-")+".json";
 const payload={version:1,exportedAt:new Date().toISOString(),source:side,works};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),link=document.createElement("a");
 link.href=url;link.download=fileName;document.body.appendChild(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
 return fileName;
}
async function resolveSyncConflict(){
 const user=auth.currentUser;if(!user)return alert("ログインしてください");
 cloudSyncBlocked=true;
 try{
  await syncQueue.catch(()=>false);
  const ref=doc(db,"users",user.uid),snap=await getDoc(ref);
  const remote=snap.exists()&&Array.isArray(snap.data().works)?snap.data().works:[];
  const local=loadWorks();
  const remoteHash=syncFingerprint(remote),localHash=syncFingerprint(local);
  if(localHash===remoteHash){cloudBaseline=remoteHash;cloudSyncBlocked=false;return alert("すでに一致しています。同期を再開しました。");}
  const localName=saveSyncSafetyFile(local,"device"),cloudName=saveSyncSafetyFile(remote,"cloud");
  alert("両方のバックアップのダウンロードを開始しました。ダウンロード一覧で2ファイルの保存完了を確認してください。\n"+localName+"\n"+cloudName);
  if(!confirm("2ファイルとも保存完了を確認しましたか？ 未確認ならキャンセルしてください。"))return;
  const choice=prompt("どちらを残しますか？\n1：クラウドの内容をこの端末へ取り込む（クラウドは変更しない）\n2：この端末の内容でクラウドを更新する（ほかの端末は別途確認）\nそれ以外：中止","中止");
  if(choice!=="1"&&choice!=="2")return;
  if(!confirm(choice==="1"?"クラウドの内容で、この端末のプロジェクト全体を置き換えます。よろしいですか？":"この端末の内容で、クラウドのプロジェクト全体を置き換えます。よろしいですか？"))return;
  if(choice==="1"){
   const current=await getDoc(ref),now=current.exists()&&Array.isArray(current.data().works)?current.data().works:[];
   if(syncFingerprint(now)!==remoteHash)return alert("途中でクラウドが変更されました。中止します。");
   if(syncFingerprint(loadWorks())!==localHash)return alert("途中で端末データが変更されました。中止します。");
   if(!saveWorks(remote))return alert("端末保存に失敗しました。取り込みを中止しました。");
   state.works=remote;state.openId=null;cloudBaseline=remoteHash;cloudSyncBlocked=false;
   render();renderAccountStatus(user);alert("クラウドから取り込みました。両方のバックアップは保管してください。");
  }else{
   if(syncFingerprint(loadWorks())!==localHash)return alert("途中で端末データが変更されました。中止します。");
   await runTransaction(db,async(tx)=>{
    const latest=await tx.get(ref);
    const latestWorks=latest.exists()&&Array.isArray(latest.data().works)?latest.data().works:[];
    if(syncFingerprint(latestWorks)!==remoteHash)throw Error("クラウドが変更されたため中止");
    tx.set(ref,{works:local},{merge:true});
   });
   cloudBaseline=localHash;cloudSyncBlocked=false;
   alert("端末のデータをクラウドへ保存しました。ほかの端末の内容は確認してください。");
  }
 }catch(e){cloudSyncBlocked=true;alert("競合解決を中止しました："+(e.message||String(e)));}
}
window.resolveSyncConflict=resolveSyncConflict;
